# Adjustments made to resolve filament loading and unloading issues caused by the interaction between the CFS 4x1 and the extruder
# All comments translated from Chinese to English

[serial_485 serial485]
serial: /dev/ttyS5
baud: 230400

[auto_addr]

[filament_rack]
not_pin: !PA5

[box]
bus:serial485
filament_sensor:filament_sensor
pre_cut_pos_x: 10#223.8        #Position for pre-contact with the tool, ensuring vertical collision
pre_cut_pos_y: 200#352
#cut_pos_x: -6.5
cut_pos_y: 200#352#368
#middle_cut_pos_y:
Tn_retrude: -20#-10#-60        #Length to retract the filament from the extruder gear after cutting
Tn_retrude_velocity: 600#360   #Retraction speed
Tn_extrude_temp: 250#220       #Extrusion temperature
Tn_extrude: 140                #If the current temperature is set, preheat the tool to 140°C
Tn_extrude_velocity: 360       #Extrusion speed
buffer_empty_len: 30           #Reserved retraction length for the buffer; required buffer length to be extruded (from cutter collision point inside the extruder to the extruder gear)
clean_left_pos_x: 135          #Left boundary of the swing movement after the hopper finishes extruding material
clean_left_pos_y: 378#380#368
clean_right_pos_x: 160         #Right boundary of the swing movement after the hopper finishes extruding material
clean_right_pos_y: 378#380
clean_velocity: 12000
box_need_clean_length:70
cut_velocity: 30000#12000
extrude_pos_x: 133#135         #Position for material extrusion during material switch
extrude_pos_y: 378#380
has_extrude_pos: 1             #Whether extrusion is needed; distinguishes between K1_MAX and f008
safe_pos_y: 345
safe_pos_x: 225
clean_pos_left_x: 160          #X-coordinate of the left boundary of the silicone nozzle wiper
clean_pos_right_x: 170         #X-coordinate of the right boundary of the silicone nozzle wiper
clean_pos_middle_y: 374        #Y-axis center coordinate of the silicone nozzle wiper
check_cut_pos_x_max: -7#-5     #Maximum X-coordinate boundary for cutter calibration
switch_pin:!nozzle_mcu:PB9
version: 1

[load_ai]

[gcode_macro BOX_CHECK_MATERIAL]
gcode:

[gcode_macro BOX_LOAD_MATERIAL_WITH_MATERIAL]
gcode:
  BOX_CHECK_MATERIAL
  BOX_CUT_MATERIAL
  BOX_SAVE_FAN
  BOX_RETRUDE_MATERIAL_WITH_TNN # BOX_RETRUDE_MATERIAL
  BOX_EXTRUDE_MATERIAL
  BOX_EXTRUDER_EXTRUDE
  BOX_MATERIAL_CHANGE_FLUSH # BOX_MATERIAL_FLUSH
  BOX_RESTORE_FAN
  BOX_MOVE_TO_SAFE_POS

[gcode_macro BOX_LOAD_MATERIAL_WITHOUT_MATERIAL]
gcode:
  M104
  BOX_CHECK_MATERIAL
  BOX_EXTRUDE_MATERIAL
  BOX_EXTRUDER_EXTRUDE
  BOX_MATERIAL_CHANGE_FLUSH # BOX_MATERIAL_FLUSH

[gcode_macro BOX_RETRUDE_MATERIAL_WITH_TNN]
rename_existing: BOX_RETRUDE_MATERIAL_WITH_TNN1
gcode:
  BOX_SET_TEMP
  BOX_GO_TO_EXTRUDE_POS
  BOX_RETRUDE_MATERIAL

[gcode_macro BOX_QUIT_MATERIAL]
gcode:
  BOX_CHECK_MATERIAL
  BOX_CUT_MATERIAL
  BOX_RETRUDE_MATERIAL_WITH_TNN
  BOX_MOVE_TO_SAFE_POS

# eg:
# BOX_EXTRUDE_MATERIAL TNN=T1A
# BOX_EXTRUDER_EXTRUDE TNN=T1A
# BOX_MATERIAL_FLUSH LEN=100 VELOCITY=360 TEMP=220
# BOX_RETRUDE_MATERIAL_WITH_TNN TNN=T1A

[gcode_macro BOX_INFO_REFRESH]
gcode:
  BOX_SET_PRE_LOADING ADDR={params.ADDR} NUM={params.NUM} ACTION=RUN
  M400
  BOX_GET_RFID ADDR={params.ADDR} NUM={params.NUM}
  M400
  BOX_GET_REMAIN_LEN ADDR={params.ADDR} NUM={params.NUM}
  M400
